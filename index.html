<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="icon" type="image/png" href="Favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    /* Restore persisted theme and language before first paint to prevent FOUC */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('dashboard_settings') || '{}');
        if (s.theme === 'dark' || s.theme === 'light') {
          document.documentElement.setAttribute('data-theme', s.theme);
        }
        if (s.language === 'en' || s.language === 'de') {
          document.documentElement.setAttribute('lang', s.language);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>

  <!-- ═══════════════════════════════════ TOOLBAR ═══════════════════════════════════ -->
  <header id="toolbar" role="banner">
    <div class="toolbar-brand">
      <span class="toolbar-title" data-i18n="app.title">Personal Dashboard</span>
    </div>
    <div class="toolbar-search">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="toolbar-search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="input-search" type="search" class="toolbar-search-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="toolbar.searchPlaceholder" placeholder="Weblinks suchen…" />
    </div>

    <nav class="toolbar-actions" role="toolbar" aria-label="Dashboard controls" data-i18n-aria="toolbar.ariaLabel">
      <button id="btn-manage-categories" class="btn btn-secondary" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span data-i18n="toolbar.manageCategories">Kategorien</span>
      </button>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <button id="btn-compact" class="btn btn-icon" type="button" aria-pressed="false">
        <svg id="icon-compact-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <svg id="icon-compact-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span class="sr-only" data-i18n="toolbar.compact">Kompakt</span>
      </button>

      <button id="btn-theme" class="btn btn-icon" type="button">
        <svg id="icon-theme-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="icon-theme-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="sr-only" data-i18n="toolbar.theme">Theme</span>
      </button>

      <button id="btn-language" class="btn btn-icon btn-lang" type="button" aria-label="Switch language" data-i18n-aria="toolbar.switchLanguage">
        <span id="lang-label">DE</span>
      </button>

      <button id="btn-reconnect-file" class="btn btn-icon btn-warn hidden" type="button" title="">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="sr-only" data-i18n="storage.reconnect">Datei neu verbinden</span>
      </button>

      <button id="btn-save-file" class="btn btn-icon btn-warn hidden" type="button" title="">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span class="sr-only" data-i18n="storage.saveFile">Datei speichern</span>
      </button>
    </nav>
  </header>

  <!-- ═══════════════════════════════════ APP LAYOUT ═══════════════════════════════════ -->
  <div class="app-layout">

    <!-- Left sidebar: category list -->
    <aside id="sidebar" role="navigation" aria-label="Kategorien" data-i18n-aria="sidebar.categories">
      <div id="sidebar-content">
        <!-- Populated by sidebar.js -->
      </div>
      <div id="sidebar-footer">
        <button id="btn-add-weblink" class="btn btn-primary sidebar-footer-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="toolbar.addWeblink">Link hinzufügen</span>
        </button>
        <button id="btn-import-bookmarks" class="btn btn-secondary sidebar-footer-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span data-i18n="toolbar.importBookmarks">Firefox-Lesezeichen importieren</span>
        </button>
      </div>
    </aside>

    <!-- Right main area: weblink tiles / compact rows -->
    <main id="main-content" role="main">
      <div id="weblink-area">
        <!-- Populated by weblinks.js -->
      </div>
    </main>

  </div>

  <!-- ═══════════════════════════════════ STORAGE SETUP OVERLAY ═══════════════════════════════════ -->
  <div id="storage-setup" class="storage-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="storage-setup-title">
    <div class="storage-card">
      <div class="storage-card-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      </div>
      <h2 id="storage-setup-title" data-i18n="storage.setupTitle">Speicherdatei verbinden</h2>
      <p data-i18n="storage.setupDescription">Wähle deine Speicherdatei aus oder erstelle eine neue, um deine Links dauerhaft zu speichern.</p>

      <!-- Chrome / Edge: direct File System Access API actions -->
      <div id="storage-direct-actions" class="storage-actions hidden">
        <button id="btn-pick-file" class="btn btn-primary" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span data-i18n="storage.selectFile">Datei auswählen</span>
        </button>
        <button id="btn-create-file" class="btn btn-secondary" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span data-i18n="storage.createFile">Neue Datei erstellen</span>
        </button>
      </div>

      <!-- Firefox: manual import/export actions -->
      <div id="storage-manual-actions" class="storage-actions hidden">
        <button id="btn-import-file-manual" class="btn btn-primary" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span data-i18n="storage.importFile">JSON-Datei importieren</span>
        </button>
        <button id="btn-start-fresh" class="btn btn-secondary" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="btn-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span data-i18n="storage.startFresh">Neu starten</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════ MODAL ROOT ═══════════════════════════════════ -->
  <div id="modal-root" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════ TOAST ROOT ═══════════════════════════════════ -->
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="assets/js/bundle.js"></script>
</body>
</html>
